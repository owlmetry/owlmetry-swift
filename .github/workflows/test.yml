name: Test

on:
  push:
  pull_request:

# Unit tests run standalone and guard day-to-day PRs. Integration tests
# (SDKIntegrationTests, AppleSearchAdsAttributionTests) require the OwlMetry
# server running at http://127.0.0.1:4111 with the test DB seeded — they're
# run locally against a running monorepo server for now:
#
#   # in owlmetry/: start test server (see scripts/test-swift-sdk.sh)
#   # in owlmetry-swift/:
#   OWLMETRY_TEST_ENDPOINT=http://127.0.0.1:4111 \
#     swift test --filter "(SDKIntegrationTests|AppleSearchAdsAttributionTests)"
#
# Automating the cross-repo integration run on a single macos-latest runner
# hung in swift test during the first attempt (the Postgres/server/seed
# steps all succeeded — the hang was in the Swift side, likely a URLSession
# timeout chain from first-run compilation latency). Revisit as a follow-up;
# one option is an ubuntu server job that a macos SDK-test job hits over
# the LAN, which avoids packing too much into a single macos runner.

jobs:
  unit:
    name: Unit tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Run unit tests
        run: swift test --skip SDKIntegrationTests --skip AppleSearchAdsAttributionTests
