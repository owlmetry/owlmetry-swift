name: Test

on:
  push:
  pull_request:
  repository_dispatch:
    types: [monorepo-updated]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Show Swift version
        run: swift --version

      - name: Run unit tests
        run: swift test --skip SDKIntegrationTests --skip AppleSearchAdsAttributionTests

  integration:
    name: Integration tests
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Checkout SDK
        uses: actions/checkout@v5
        with:
          path: sdk

      - name: Checkout main repo
        uses: actions/checkout@v5
        with:
          repository: owlmetry/owlmetry
          path: main

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Get pnpm store path
        id: pnpm-store
        working-directory: main
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('main/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install and start Postgres
        run: |
          brew install postgresql@16
          PG_PREFIX=$(brew --prefix postgresql@16)
          echo "$PG_PREFIX/bin" >> $GITHUB_PATH
          export PATH="$PG_PREFIX/bin:$PATH"
          brew services start postgresql@16
          for i in {1..30}; do
            if pg_isready -h localhost; then echo "Postgres ready"; break; fi
            sleep 1
          done
          # setup.ts uses hardcoded postgres://localhost:5432/owlmetry_test (no
          # creds) and relies on the OS user being a DB superuser via trust
          # auth — that's how brew-installed postgres sets up the installing
          # user. createdb inherits those creds.
          createdb owlmetry_test
          psql -d owlmetry_test -c "SELECT current_user;"

      - name: Install and build monorepo
        working-directory: main
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Seed test database
        working-directory: main/apps/server
        run: ./node_modules/.bin/tsx ../../scripts/seed-test-db.mts

      - name: Start test server (detached)
        working-directory: main/apps/server
        env:
          DATABASE_URL: postgres://localhost:5432/owlmetry_test
          PORT: "4111"
          JWT_SECRET: test-secret
          HOST: 127.0.0.1
          API_PUBLIC_URL: http://127.0.0.1:4111
        run: |
          # nohup + disown lets the server survive past the step boundary:
          # nohup blocks SIGHUP, disown drops the job from the shell's table
          # so the shell won't kill it on exit. (setsid would also work on
          # Linux runners but isn't shipped on macOS.)
          nohup ./node_modules/.bin/tsx src/index.ts > /tmp/server.log 2>&1 < /dev/null &
          SERVER_PID=$!
          echo "$SERVER_PID" > /tmp/server.pid
          disown "$SERVER_PID"
          for i in $(seq 1 60); do
            if curl -sf "http://127.0.0.1:4111/health" > /dev/null 2>&1; then
              echo "Server ready (pid $(cat /tmp/server.pid))"
              exit 0
            fi
            sleep 0.5
          done
          echo "Server failed to start"
          cat /tmp/server.log
          exit 1

      - name: Confirm server still up after step boundary
        run: |
          if ! kill -0 "$(cat /tmp/server.pid)" 2>/dev/null; then
            echo "Server PID $(cat /tmp/server.pid) is gone after step boundary"
            cat /tmp/server.log
            exit 1
          fi
          curl -sf "http://127.0.0.1:4111/health" | head -c 500
          echo
          echo "Server healthy ✓"

      - name: Pre-build SDK tests (separate compile time from test runtime)
        working-directory: sdk
        run: swift build --build-tests

      - name: Run SDK integration tests
        working-directory: sdk
        timeout-minutes: 10
        env:
          OWLMETRY_TEST_ENDPOINT: http://127.0.0.1:4111
        run: |
          swift test \
            --skip-build \
            --filter "(SDKIntegrationTests|AppleSearchAdsAttributionTests)" \
            2>&1

      - name: Stop test server
        if: always()
        run: |
          if [ -f /tmp/server.pid ]; then
            kill "$(cat /tmp/server.pid)" 2>/dev/null || true
          fi

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: server-log
          path: /tmp/server.log
